apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-backend

  template:
    metadata:
      labels:
        app: inventory-backend

    spec:
      containers:
        - name: backend
          image: inventory-api:latest
          command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
          ports:
            - containerPort: 8000